ServerName localhost
ServerTokens Prod
ServerSignature Off

# Lets PHP read the Supabase connection string from Render's Environment tab
PassEnv SUPABASE_DB_URL

# Password-protected admin area (users come from ADMIN_USER / ADMIN_PASS, see entrypoint.sh)
<Directory /var/www/html/admin>
    Options -Indexes
    AuthType Basic
    AuthName "MacOs admin"
    AuthUserFile /etc/apache2/.htpasswd
    Require valid-user
</Directory>

# The shop and the admin page keep using the same web addresses as before:
#   /data/products.json  and  /img/<name>.jpg
# but now the answers come from Supabase.
AliasMatch "^/data/products\.json$" "/var/www/html/api/products.php"
AliasMatch "^/img/([A-Za-z0-9_-]+)\.jpg$" "/var/www/html/api/image.php"

<Directory /var/www/html/api>
    Options -Indexes
    Require all granted
</Directory>
